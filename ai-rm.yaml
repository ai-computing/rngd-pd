name: rngd-pd
protocol: "0.1"
layer: l3-serving
kind: service
summary: Llama-3.1-8B를 RNGD prefill + ATOM decode llm-d Pod로 분리 서빙하는 PD 서비스
maturity: experimental
hardware: [RNGD, ATOM]
install:
  - python3 -m pip install --user -e .   # rm-core + entry points; NPU SDK와 vllm은 호스트 것을 사용
test:
  - python -m rm_core.conformance airm.kv_transports shm
  - PYTHONPATH=src python -m pytest -q tests/native_v4 tests/test_airm.py
  - PYTHONPATH=src python -m rngd_pd.connector.transport
  - python tests/test_connector_tcp.py
  - helm template deploy/helm/rngd-pd
adapters:
  - group: airm.kv_transports
    name: shm                 # rngd_pd.airm:ShmTransport (/dev/shm host staging, bf16 wire)
  - group: airm.workloads
    name: rngd-pd             # rngd_pd.airm:run
deploy:
  target: llm-d
  chart: deploy/helm/rngd-pd
  manifests: deploy/k8s       # 실험 sweep용, gen_sweep.py가 생성 (kustomization 없음)
  image: null                 # Pod는 ubuntu:22.04 + 호스트 마운트로 실행 (chart의 image/hostMounts override)
config:
  env_example: cluster.example.env
  env: [AIRM_KV_TRANSPORT, AIRM_METRICS_PORT, PD_SHM_ROOT]
metrics: [ttft_p90_ms, tpot_p90_ms, tok_s, kv_transfer_ms]
interfaces:
  provides: [Workload, KVTransport, Metrics]
  uses: []                    # KV 경로는 이름으로 선택 (예: hetero-npu-p2p의 p2p)
kpi: [MFU, 전력효율, 이종자원수, SLO]
