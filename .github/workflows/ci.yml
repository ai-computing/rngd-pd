# NPU-free tests on every push to main and every pull request.
# The NPU stacks (furiosa, rebellions, vllm) cannot be installed here; tests that
# need them run on the NPU node (README, Quick start).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install numpy pytest pyzmq
      - name: NPU-free tests
        run: |
          # tests/native_v4/test_serve.py needs the serving stack (httpx, fastapi)
          PYTHONPATH=src python -m pytest -q tests/test_devices.py tests/native_v4 \
            tests/test_continuous_backlog.py tests/test_solo_openai.py \
            --ignore=tests/native_v4/test_serve.py $(ls -d tests/swap 2>/dev/null)
