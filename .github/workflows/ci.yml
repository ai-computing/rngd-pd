# NPU-free tests on every push to main and every pull request.
# Vendor SDK integration runs separately on NPU nodes. Connector unit tests
# isolate only the vLLM import boundary when vLLM is absent.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest pyzmq httpx fastapi uvicorn transformers safetensors
          python -m pip install -e .
      - name: NPU-free tests
        run: |
          python -m pytest -q tests
      - name: Verify published native binding evidence
        run: |
          for check in experiments/verify_rngd_binding_evidence.py experiments/verify_atom_binding_evidence.py; do
            if [ -f "$check" ]; then python "$check"; fi
          done
