# Emit the sweep deployment: six workers, one router, four configurations.
---
apiVersion: v1
kind: Service
metadata: {name: sw-rngd-prefill, namespace: llm-serving}
spec:
  selector: {app: sw-rngd-prefill}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sw-rngd-prefill
  namespace: llm-serving
  labels: {app: sw-rngd-prefill, llm-d.ai/sweep: "true"}
spec:
  replicas: 1
  strategy: {type: Recreate}      # one card per pod: no two may overlap
  selector: {matchLabels: {app: sw-rngd-prefill}}
  template:
    metadata:
      labels: {app: sw-rngd-prefill, llm-d.ai/sweep: "true"}
    spec:
      nodeSelector: {kubernetes.io/hostname: npu-node-1}
      containers:
      - name: worker
        image: ubuntu:22.04
        imagePullPolicy: IfNotPresent
        command: [bash, -c]
        args:
        - |
          set -eu; export DEBIAN_FRONTEND=noninteractive; apt-get update -qq; apt-get install -y -qq --no-install-recommends python3.10 python3.10-dev python3-pip libdrm2 libnuma1 libgomp1 ca-certificates tzdata >/dev/null; exec /venv/bin/python -m rngd_pd.serving.cluster --role prefill --backend rngd-full --C 256 --group 2 --chip 0 --S 256 --port 8000
        env:
        - {name: PYTHONPATH, value: "/app/src:/home/user/.local/lib/python3.10/site-packages:/host-sys-local-pkgs:/host-sys-pkgs"}
        - {name: LD_LIBRARY_PATH, value: "/host-rbln-lib:/host-libs"}
        - {name: PATH, value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/host-rbln-bin"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: VLLM_PLUGINS, value: ""}
        - {name: HF_HOME, value: "/hf"}
        - {name: MODEL, value: "meta-llama/Llama-3.1-8B-Instruct"}
        - {name: PD_SHM_ROOT, value: "/dev/shm/rngd_kv_cluster"}
        ports: [{containerPort: 8000}]
        resources:
          limits: {furiosa.ai/rngd: "1"}
          requests: {cpu: "8", memory: 64Gi, furiosa.ai/rngd: "1"}
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 120         # cold start: weights, then artifact load
        securityContext:
          seccompProfile: {type: Unconfined}
          privileged: true
        volumeMounts:
        - {name: local-pkgs, mountPath: /home/user/.local/lib/python3.10/site-packages, readOnly: true}
        - {name: sys-local-pkgs, mountPath: /host-sys-local-pkgs, readOnly: true}
        - {name: sys-pkgs, mountPath: /host-sys-pkgs, readOnly: true}
        - {name: libs, mountPath: /host-libs, readOnly: true}
        - {name: rbln-lib, mountPath: /host-rbln-lib, readOnly: true}
        - {name: rbln-bin, mountPath: /host-rbln-bin, readOnly: true}
        - {name: app, mountPath: /app}
        - {name: hf, mountPath: /hf}
        - {name: dshm, mountPath: /dev/shm}
        - {name: venv, mountPath: /venv, readOnly: true}
        - {name: devrngd, mountPath: /dev/rngd}
      volumes:
      - {name: local-pkgs, hostPath: {path: /home/user/.local/lib/python3.10/site-packages, type: Directory}}
      - {name: sys-local-pkgs, hostPath: {path: /usr/local/lib/python3.10/dist-packages, type: Directory}}
      - {name: sys-pkgs, hostPath: {path: /usr/lib/python3/dist-packages, type: Directory}}
      - {name: libs, hostPath: {path: /usr/lib/x86_64-linux-gnu, type: Directory}}
      - {name: rbln-lib, hostPath: {path: /usr/lib, type: Directory}}
      - {name: rbln-bin, hostPath: {path: /usr/bin, type: Directory}}
      - {name: app, hostPath: {path: /home/user/workspace/01_pd_disag/rngd_llmd, type: Directory}}
      - {name: hf, hostPath: {path: /home/user/.cache/huggingface, type: Directory}}
      - {name: dshm, hostPath: {path: /dev/shm, type: Directory}}
      - {name: venv, hostPath: {path: /home/user/venvs/furiosa, type: Directory}}
      - {name: devrngd, hostPath: {path: /dev/rngd, type: Directory}}
---
