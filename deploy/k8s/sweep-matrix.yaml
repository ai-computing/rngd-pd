          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 120         # cold start: weights, then artifact load
        securityContext:
          seccompProfile: {type: Unconfined}
          privileged: true
        volumeMounts:
        - {name: local-pkgs, mountPath: /home/user/.local/lib/python3.10/site-packages, readOnly: true}
        - {name: sys-local-pkgs, mountPath: /host-sys-local-pkgs, readOnly: true}
        - {name: sys-pkgs, mountPath: /host-sys-pkgs, readOnly: true}
