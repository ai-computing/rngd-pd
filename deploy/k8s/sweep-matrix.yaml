data:
  targets.json: |
    {
      "llama8b-rngd-alone": {
        "prefill": "http://sw-rngd-prefill.llm-serving.svc.cluster.local:8000",
        "decode": {
          "1": "http://sw-rngd-decode.llm-serving.svc.cluster.local:8000",
