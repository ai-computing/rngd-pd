      - {name: local-pkgs, hostPath: {path: /home/user/.local/lib/python3.10/site-packages, type: Directory}}
      - {name: sys-local-pkgs, hostPath: {path: /usr/local/lib/python3.10/dist-packages, type: Directory}}
      - {name: sys-pkgs, hostPath: {path: /usr/lib/python3/dist-packages, type: Directory}}
      - {name: libs, hostPath: {path: /usr/lib/x86_64-linux-gnu, type: Directory}}
      - {name: rbln-lib, hostPath: {path: /usr/lib, type: Directory}}
      - {name: rbln-bin, hostPath: {path: /usr/bin, type: Directory}}
      - {name: app, hostPath: {path: /home/user/workspace/01_pd_disag/rngd_llmd, type: Directory}}
      - {name: hf, hostPath: {path: /home/user/.cache/huggingface, type: Directory}}
      - {name: dshm, hostPath: {path: /dev/shm, type: Directory}}
      - {name: venv, hostPath: {path: /home/user/venvs/furiosa, type: Directory}}
