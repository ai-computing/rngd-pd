        }
      },
      "llama8b-pd-forward": {
        "prefill": "http://sw-rngd-prefill.llm-serving.svc.cluster.local:8000",
        "decode": {
          "1": "http://sw-atom-decode-b1.llm-serving.svc.cluster.local:8000",
