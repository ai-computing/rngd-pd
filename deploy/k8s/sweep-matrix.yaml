        - {name: rbln-lib, mountPath: /host-rbln-lib, readOnly: true}
        - {name: rbln-bin, mountPath: /host-rbln-bin, readOnly: true}
        - {name: app, mountPath: /app}
        - {name: hf, mountPath: /hf}
        - {name: dshm, mountPath: /dev/shm}
        - {name: venv, mountPath: /venv, readOnly: true}
        - {name: devrngd, mountPath: /dev/rngd}
